name: Lost Santos – Regelwerk und Wiki

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regelwerk-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regelwerk und Wiki bauen
        run: node tools/build-site.mjs
      - name: Seiten und Verweise prüfen
        run: node tools/check-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Webseite veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
